version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edh-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - edh-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: edh-worker
    env_file:
      - .env
    depends_on:
      - backend
      - db
    networks:
      - edh-network

  db:
    image: postgres:15
    container_name: edh-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: deployer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - edh-network

  proxy:
    image: traefik:v3.0
    container_name: edh-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edh-network

volumes:
  postgres_data:

networks:
  edh-network:
    name: edh-network
    driver: bridge
